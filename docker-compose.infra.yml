# Start only Postgres + Redis for local backend/frontend dev:
#   docker compose -f docker-compose.infra.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anonshare
      POSTGRES_PASSWORD: anonshare
      POSTGRES_DB: anonshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonshare -d anonshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
