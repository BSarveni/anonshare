# Local dev: Postgres + Redis only. Run API/frontend on the host with hot reload.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Backend:
#   cd backend && uvicorn main:app --reload
#   celery -A tasks.celery_app worker --loglevel=info
#   celery -A tasks.celery_app beat --loglevel=info
#
# Frontend:
#   cd frontend && npm run dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anonshare
      POSTGRES_PASSWORD: anonshare
      POSTGRES_DB: anonshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonshare -d anonshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
